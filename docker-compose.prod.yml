services:
  # Ocean AI 网关总线 (NestJS + Prisma)
  gateway:
    image: ${DOCKERHUB_USERNAME:-ocean}/ocean-gateway:latest
    container_name: ocean-gateway
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./agents/skills:/app/agents/skills
      - ocean_gateway_uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATEWAY_ROOT=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Ocean Web（Next.js App Router / Server Components）
  web:
    image: ${DOCKERHUB_USERNAME:-ocean}/ocean-web:latest
    container_name: ocean-web
    restart: always
    ports:
      - "8081:3000"
    environment:
      - OCEAN_GATEWAY_URL=http://gateway:3000
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    depends_on:
      gateway:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # 用户中心持久化核心 (支持 Vector 检索)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ocean-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ocean}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-ocean}
    ports:
      - "5432:5432"
    volumes:
      - ocean_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocean} -d ${POSTGRES_DB:-ocean}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 可观测性中心 (Tracing / Jaeger)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ocean-jaeger
    restart: always
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 会话记忆与流控层 (Redis)
  redis:
    image: redis:7-alpine
    container_name: ocean-redis
    ports:
      - "6379:6379"
    volumes:
      - ocean_redis_data:/data

volumes:
  ocean_postgres_data:
  ocean_redis_data:
  ocean_gateway_uploads:
