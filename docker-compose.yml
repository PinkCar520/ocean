# Ocean 服务编排
#
# 默认：核心平台栈（gateway / worker / web / postgres / redis / fastapi）
#   docker compose up -d
#
# Jenkins、GitLab 和禅道通过 .env 或工作区配置连接远程实例。
x-logging: &service-logging
  driver: local

services:
  # Ocean AI 网关总线 (NestJS + Prisma)
  gateway:
    container_name: ocean-gateway
    logging: *service-logging
    image: ocean-gateway:local
    build: &gateway-build
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      - ./agents/skills:/app/agents/skills:ro
      - ocean_gateway_uploads:/app/apps/gateway/public/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATEWAY_ROOT=/app
      # 集成目标地址：在 .env 中配置真实 SaaS 地址；留空则相关能力自动 mock / 禁用。
      - ZENTAO_BASE_URL=${ZENTAO_BASE_URL:-}
      - JENKINS_BASE_URL=${JENKINS_BASE_URL:-}
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-}
      - FASTAPI_URL=http://fastapi-backend:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/metrics').then(response => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fastapi-backend:
        condition: service_healthy

  # Ocean Run Engine Worker（独立进程消费 outbox，ADR-002/003；Web 切 Run API 的执行前提）
  worker:
    container_name: ocean-worker
    logging: *service-logging
    image: ocean-gateway:local
    build: *gateway-build
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATEWAY_ROOT=/app
      - WORKER_POLL_MS=1000
      - WORKER_CLAIM_LIMIT=5
      - FASTAPI_URL=http://fastapi-backend:8000
      - WORKER_LOG_LEVEL=log
      - WORKER_READY_PORT=3001
    command: ["node", "dist/apps/gateway/src/worker/main"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(response => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fastapi-backend:
        condition: service_healthy

  migrate:
    logging: *service-logging
    image: ocean-gateway:local
    build: *gateway-build
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy

  # Ocean Web（Next.js App Router / Server Components）
  web:
    container_name: ocean-web
    logging: *service-logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8081:3000"
    environment:
      - OCEAN_GATEWAY_URL=http://gateway:3000
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', { redirect: 'manual' }).then(response => process.exit(response.status >= 200 && response.status < 400 ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      gateway:
        condition: service_healthy

  # 用户中心持久化核心 (支持 Vector 检索)
  postgres:
    container_name: ocean-postgres
    logging: *service-logging
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ocean}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-ocean}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ocean_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  # 会话记忆与流控层 (Redis)
  redis:
    container_name: ocean-redis
    logging: *service-logging
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: always
    command: ["redis-server", "--save", "3600 1 300 100 60 10000"]
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ocean_redis_data:/data

  # Ocean AI 智力中枢 (Python FastAPI)
  fastapi-backend:
    container_name: ocean-fastapi-backend
    logging: *service-logging
    build:
      context: ./apps/fastapi-backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ocean_postgres_data:
  ocean_redis_data:
  ocean_gateway_uploads:
