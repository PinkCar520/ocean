packages:
  - "apps/*"
  - "packages/ui"
  - "packages/contracts"
  - "packages/shared/*"
  - "packages/tools/*"
  - "agents/agp"
  - "agents/skills"
  - "agents/mcp/*"

managePackageManagerVersions: false

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  bcrypt: true
  electron: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.2'
  - '@ai-sdk/mcp@2.0.0'
  - '@ai-sdk/provider-utils@5.0.0'
  - '@ai-sdk/provider@4.0.0'
  - '@ai-sdk/react@4.0.2'
  - ai@7.0.2
  - '@ai-sdk/anthropic@4.0.0'
  - '@ai-sdk/google@4.0.0'
  - '@ai-sdk/openai@4.0.0'

overrides:
  zod: 4.4.3
