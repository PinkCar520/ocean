packages:
  - "apps/*"
  - "packages/ui"
  - "packages/contracts"
  - "packages/shared/*"
  - "packages/tools/*"
  - "agents/agp"
  - "agents/skills"
  - "agents/mcp/*"

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  bcrypt: true
  electron: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.2||4.0.149'
  - '@ai-sdk/mcp@2.0.0||2.0.101'
  - '@ai-sdk/provider-utils@5.0.0||5.0.82'
  - '@ai-sdk/provider@4.0.0||4.0.39'
  - '@ai-sdk/react@4.0.2||4.0.180'
  - ai@7.0.2||7.0.176
  - '@ai-sdk/anthropic@4.0.0||4.0.106'
  - '@ai-sdk/deepseek@3.0.88'
  - '@ai-sdk/google@4.0.0||4.0.122'
  - '@ai-sdk/openai@4.0.0||4.0.121'
  - csstype@3.2.4
