name: Ocean Task Compliance

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  issues: read

concurrency:
  group: task-compliance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  task-compliance:
    name: ocean/task-compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify task reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          def fail(message):
              print(message)
              sys.exit(1)

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event:
              body = json.load(event)["pull_request"].get("body") or ""

          refs = re.findall(r"(?im)^Task:[ \t]*#([1-9][0-9]*)[ \t]*\r?$", body)
          if len(refs) != 1:
              fail("Provide exactly one Task: #<issue number> line in the PR body.")

          number = int(refs[0])
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{number}"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          })
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  issue = json.load(response)
          except urllib.error.HTTPError as error:
              fail(f"Unable to verify task issue #{number}: HTTP {error.code}.")
          except (urllib.error.URLError, TimeoutError, ValueError):
              fail("Unable to verify task issue through GitHub API.")

          if "pull_request" in issue or issue.get("state") != "open":
              fail(f"Task #{number} must be an open issue, not a PR.")

          print(f"Verified open same-repository task issue #{number}.")
          PY
