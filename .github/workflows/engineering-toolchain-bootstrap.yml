name: Engineering toolchain lock generation (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/engineering-toolchain-bootstrap.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve exact engineering tool versions and lockfile
        run: pnpm add -Dw --save-exact --lockfile-only --ignore-scripts knip jscpd dependency-cruiser
      - name: Validate generated lockfile
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
      - name: Emit generated patch
        run: |
          git diff -- package.json pnpm-lock.yaml > "$RUNNER_TEMP/engineering-toolchain.patch"
          test -s "$RUNNER_TEMP/engineering-toolchain.patch"
          echo 'ENGINEERING_PATCH_BEGIN'
          cat "$RUNNER_TEMP/engineering-toolchain.patch"
          echo 'ENGINEERING_PATCH_END'
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-toolchain-lock-patch
          path: ${{ runner.temp }}/engineering-toolchain.patch
          if-no-files-found: error
