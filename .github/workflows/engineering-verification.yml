name: Ocean Workspace Verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  workspace-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gateway exec prisma generate
      - run: node --test scripts/engineering/verification.test.mjs
      - run: node scripts/engineering/verification.mjs "$RUNNER_TEMP/workspace-verification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-verification
          path: ${{ runner.temp }}/workspace-verification
          if-no-files-found: error
