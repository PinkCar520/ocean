name: Ocean Shared UI Browser Verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      ENGINEERING_BROWSER_OUTPUT: ${{ runner.temp }}/engineering-browser
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm run audit:ui:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-browser
          path: ${{ runner.temp }}/engineering-browser
          if-no-files-found: error
