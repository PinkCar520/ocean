name: Build and Push Docker Images
permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ocean-image-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    if: github.ref == 'refs/heads/main'

  prep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate registry namespace and compute immutable revision
        id: vars
        env:
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ ! "$TCR_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]{0,62}$ ]]; then
            echo "::error::Set repository variable TCR_NAMESPACE to the actual TCR namespace"
            exit 1
          fi
          echo "sha_short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ccr.ccs.tencentyun.com/$TCR_NAMESPACE" >> "$GITHUB_OUTPUT"

  build-and-push-gateway:
    name: Build and Push Gateway Image
    needs: [prep, quality]
    environment: production
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Tencent Cloud TCR
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prep.outputs.image_prefix }}/ocean-gateway
          tags: |
            type=raw,value=${{ needs.prep.outputs.sha_short }}

      - name: Build and push Gateway Docker image
        id: build
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./apps/gateway/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ocean-gateway
          cache-to: type=gha,scope=ocean-gateway,mode=max

  build-and-push-web:
    name: Build and Push Web Image
    needs: [prep, quality]
    environment: production
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Tencent Cloud TCR
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prep.outputs.image_prefix }}/ocean-web
          tags: |
            type=raw,value=${{ needs.prep.outputs.sha_short }}

      - name: Build and push Web Docker image
        id: build
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          provenance: false
          build-args: |
            CACHE_BUST=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ocean-web
          cache-to: type=gha,scope=ocean-web,mode=max

  verify-publication:
    name: Verify TCR publication
    needs: [prep, build-and-push-gateway, build-and-push-web]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Log in to Tencent Cloud TCR
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify exact remote image digests and write release manifest
        env:
          PREFIX: ${{ needs.prep.outputs.image_prefix }}
          GATEWAY_DIGEST: ${{ needs.build-and-push-gateway.outputs.digest }}
          WEB_DIGEST: ${{ needs.build-and-push-web.outputs.digest }}
          TAG: ${{ needs.prep.outputs.sha_short }}
        run: |
          set -euo pipefail
          for digest in "$GATEWAY_DIGEST" "$WEB_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done
          for service in gateway web; do
            case "$service" in
              gateway) digest="$GATEWAY_DIGEST" ;;
              web) digest="$WEB_DIGEST" ;;
            esac
            image="$PREFIX/ocean-$service"
            docker buildx imagetools inspect "$image@$digest"
            actual=$(docker buildx imagetools inspect "$image:$TAG" --format '{{json .Manifest}}' | jq -er '.digest')
            [[ "$actual" == "$digest" ]]
          done
          jq -n --arg revision "$GITHUB_SHA" --arg tag "$TAG" \
            --arg gateway "$PREFIX/ocean-gateway@$GATEWAY_DIGEST" \
            --arg web "$PREFIX/ocean-web@$WEB_DIGEST" \
            '{revision:$revision,tag:$tag,images:{gateway:$gateway,web:$web}}' > ocean-release.json
          cat ocean-release.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified publication manifest
        uses: actions/upload-artifact@v4
        with:
          name: ocean-release-${{ github.sha }}
          path: ocean-release.json
          if-no-files-found: error
          retention-days: 30
