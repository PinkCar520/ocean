name: Build and Push Docker Images
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  prep:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  build-and-push-gateway:
    name: Build and Push Gateway Image
    needs: [prep, quality]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ocean-gateway
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prep.outputs.sha_short }}

      - name: Build and push Gateway Docker image
        id: build
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./apps/gateway/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-web:
    name: Build and Push Web Image
    needs: [prep, quality]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ocean-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prep.outputs.sha_short }}

      - name: Build and push Web Docker image
        id: build
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          provenance: false
          build-args: |
            CACHE_BUST=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Auto Deploy to Server
    needs: [build-and-push-gateway, build-and-push-web]
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: self-hosted
    concurrency:
      group: ocean-server-deployment
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull and Start Production Services
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          OCEAN_GATEWAY_DIGEST: ${{ needs.build-and-push-gateway.outputs.digest }}
          OCEAN_WEB_DIGEST: ${{ needs.build-and-push-web.outputs.digest }}
        run: |
          cd "$HOME/ocean"
          compose=(docker compose --project-directory "$PWD" --env-file .env -f "$GITHUB_WORKSPACE/docker-compose.prod.yml")
          "${compose[@]}" pull
          "${compose[@]}" up -d --remove-orphans --wait --wait-timeout 300
