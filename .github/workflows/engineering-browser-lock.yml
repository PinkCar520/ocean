name: Engineering browser dependency lock bootstrap (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/engineering-browser-lock.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve exact browser test dependency
        run: pnpm add -Dw --save-exact --lockfile-only --ignore-scripts @playwright/test
      - run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
      - name: Emit exact generated patch
        run: |
          git diff -- package.json pnpm-lock.yaml > "$RUNNER_TEMP/browser-lock.patch"
          test -s "$RUNNER_TEMP/browser-lock.patch"
          echo 'ENGINEERING_BROWSER_PATCH_BEGIN'
          cat "$RUNNER_TEMP/browser-lock.patch"
          echo 'ENGINEERING_BROWSER_PATCH_END'
      - uses: actions/upload-artifact@v4
        with:
          name: browser-lock-patch
          path: ${{ runner.temp }}/browser-lock.patch
          if-no-files-found: error
