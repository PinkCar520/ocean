service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
extensions:
  jaeger_query:
    storage:
      traces: ocean_traces
  jaeger_storage:
    backends:
      ocean_traces:
        badger:
          directories:
            keys: /badger/traces/keys
            values: /badger/traces/values
          ephemeral: false
          ttl:
            spans: 72h
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  jaeger_storage_exporter:
    trace_storage: ocean_traces
