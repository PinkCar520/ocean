[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "olo-system"
version = "0.1.0"
description = "OLO context, agent, permission, tool, and evaluation system"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "services/api/src/olo_api",
  "services/context-engine/src/olo_context",
  "services/agent-runtime/src/olo_agent",
  "services/tool-gateway/src/olo_tools",
  "packages/permissions/src/olo_permissions",
  "packages/memory/src/olo_memory",
  "packages/model-adapters/src/olo_models",
]

[tool.hatch.build.targets.wheel.force-include]
"services/api/migrations" = "olo_api/sql_migrations"

[tool.pytest.ini_options]
pythonpath = [
  "services/api/src",
  "services/context-engine/src",
  "services/agent-runtime/src",
  "services/tool-gateway/src",
  "packages/permissions/src",
  "packages/memory/src",
  "packages/model-adapters/src",
]
testpaths = ["services", "packages", "evals"]

[tool.ruff]
line-length = 100
target-version = "py313"
